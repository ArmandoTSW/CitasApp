<!<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #374151);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .contenedor {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.30);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 22px;
            color: #111827;
        }

        .seccion {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .botones-api,
        .botones-calculadora {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            border: none;
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .gris1 { background: #111827; }
        .gris2 { background: #374151; }
        .gris3 { background: #4b5563; }
        .gris4 { background: #6b7280; }

        label {
            font-weight: 600;
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            font-size: 15px;
        }

        .botones-calculadora {
            margin-top: 18px;
        }

        .resultado {
            margin-top: 16px;
            padding: 15px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            min-height: 60px;
        }

        .resultado strong {
            font-size: 24px;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 190px;
            overflow-y: auto;
            background: #111827;
            color: #e5e7eb;
            padding: 14px;
            border-radius: 14px;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .botones-api,
            .botones-calculadora {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <h1>Calculadora</h1>

        <section class="seccion">
            <div class="botones-api">
                <button class="gris1" onclick="consultarApi('/api/pacientes')">Pacientes</button>
                <button class="gris2" onclick="consultarApi('/api/medicos')">Médicos</button>
                <button class="gris3" onclick="consultarApi('/api/citas')">Citas</button>
                <button class="gris4" onclick="consultarApi('/api/citas/porpaciente/1')">Paciente 1</button>
            </div>

            <div class="resultado">
                <pre id="resultadoApi">Selecciona una opción.</pre>
            </div>
        </section>

        <section class="seccion">
            <label for="numeroA">Primer número</label>
            <input type="number" id="numeroA" placeholder="Ejemplo: 28">

            <label for="numeroB">Segundo número</label>
            <input type="number" id="numeroB" placeholder="Ejemplo: 32">

            <div class="botones-calculadora">
                <button class="gris1" onclick="calcular('sumar')">Sumar</button>
                <button class="gris2" onclick="calcular('restar')">Restar</button>
                <button class="gris3" onclick="calcular('multiplicar')">Multiplicar</button>
                <button class="gris4" onclick="calcular('dividir')">Dividir</button>
            </div>

            <div id="resultadoCalculadora" class="resultado">
                Resultado
            </div>
        </section>
    </div>

    <script>
        async function calcular(operacion) {
            const a = document.getElementById("numeroA").value;
            const b = document.getElementById("numeroB").value;
            const resultadoDiv = document.getElementById("resultadoCalculadora");

            if (a === "" || b === "") {
                resultadoDiv.innerHTML = "Ingresa ambos números.";
                return;
            }

            try {
                const respuesta = await fetch(`/api/calculadora/${operacion}?a=${a}&b=${b}`);
                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    resultadoDiv.innerHTML = datos.error || "Error en la operación.";
                    return;
                }

                resultadoDiv.innerHTML = `<strong>${datos.resultado}</strong>`;
            } catch {
                resultadoDiv.innerHTML = "No se pudo conectar con la API.";
            }
        }

        async function consultarApi(endpoint) {
            const resultadoApi = document.getElementById("resultadoApi");

            try {
                const respuesta = await fetch(endpoint);
                const datos = await respuesta.json();

                resultadoApi.textContent = JSON.stringify(datos, null, 2);
            } catch {
                resultadoApi.textContent = "No se pudo consultar la API.";
            }
        }
    </script>
</body>
</html>
